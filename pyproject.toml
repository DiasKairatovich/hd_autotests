[project]
name = "teye-autotests"
version = "0.1.0"
description = "TargetEYE Autotests shemathesis framework"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pytest>=8.4,<9.0",
  "httpx[http2]>=0.28,<0.29",
  "allure-pytest>=2.15,<3.0",
  "schemathesis>=4.1,<4.2",
  "pytest-xdist>=3.8.0",
  "tenacity>=9.1.2",
  "pytest-rerunfailures>=16.0.1",
  "requests>=2.32,<3.0",
  "playwright>=1.46,<1.50",
  "pytest-playwright>=0.5.0",
  "pydantic-settings>=2.13.1",
  "paramiko>=5.0.0",
  "etcd3>=0.12.0",
  "kafka-python>=3.0.11",
  "confluent-kafka>=2.15.0",
  "cassandra-driver>=3.30.1",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5,<6",
]

[tool.pytest.ini_options]
reruns = 1
reruns_delay = 5
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:etcd3.*",
    "ignore::DeprecationWarning:google.protobuf.*",
]
markers = [
    "api: API tests",
    "component: component-level API tests",
    "smoke: lightweight smoke checks for critical endpoints",
    "slow: heavyweight low speed tests",
    "ui: ui health-checks",
    "e2e: end-to-end API flow tests",
    "negative: negative API tests",
    "tms: test case ID in TMS",
    "dashboard: Dashboard page tests",
    "cameras: Camera page tests",
    "videowalls: Videowalls page tests",
    "places: Places page tests",
    "login: Login page tests",
    "lists: Lists page tests",
    "groups: Groups page tests",
    "users: Users page tests",
    "sensors: Sensors page tests",
    "subscriptions: Subscriptions page tests",
    "webhooks: Webhooks page tests",
    "map: Map page tests",
    "events: Events page tests"
]
testpaths = ["tests"]
